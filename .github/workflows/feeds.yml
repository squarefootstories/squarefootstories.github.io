name: Release scheduled pins to RSS feeds

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_feeds.py
      - name: Commit feeds if changed
        run: |
          if [ -n "$(git status --porcelain feeds)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feeds
            git commit -m "Release scheduled pins to feeds"
            git push
          fi
